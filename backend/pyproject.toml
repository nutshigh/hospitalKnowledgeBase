[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10,<3.11"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "numpy>=2.0",
    "httpx>=0.28.1",
    "opencv-python-headless>=4.13.0.92",
    "openpyxl>=3.1.5",
    "passlib[bcrypt]>=1.7.4",
    "pika>=1.4.0",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pydantic-settings>=2.14.1",
    "pymilvus>=2.5.2,<3.0.0",
    "pymupdf>=1.27.2.3",

    "pymysql>=1.1.3",
    "redis>=5.0,<6.0",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.28",
    "sqlalchemy>=2.0.49",
    "starlette>=0.45.0",
    "typing-extensions>=4.12.0",
    "uvicorn[standard]>=0.47.0",
    "json-repair>=0.30,<1",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.4.7,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.2.5,<1.3",
    "llama-index-core>=0.12,<0.13",
    "llama-index-vector-stores-milvus>=0.4,<0.5",
    "llama-index-readers-file>=0.4,<0.5",
    "llama-index-embeddings-openai>=0.3,<0.4",
    "llama-index-postprocessor-flag-embedding-reranker>=0.3,<0.4",
    "llama-index-retrievers-bm25>=0.5,<0.6",
    "torch==2.7.0",  # cu12,匹配驱动535;否则uv默认拉cu13/torch2.11崩溃
    "transformers==4.51.3",  # pin老版;transformers 5.x移除prepare_for_model,FlagEmbedding 1.4 还在用
    "tokenizers==0.21.4",  # 与 transformers 4.51 配套;高版 tokenizers ABI 不兼容
    "FlagEmbedding>=1.3,<2",
    "neo4j>=5.20,<6",  # KG 通道用,kg_client.py 顶层 import;否则 ModuleNotFoundError 连带丢弃文档向量结果
    "jieba>=0.42.1",  # KG 检索中文分词;主 venv 缺它会导致 kg_client 走 fallback 整串分词,KG 命中能力腰斩
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "freezegun>=1.5",
]

# vllm 不作为本包依赖: 推理由 start.sh 拉起的独立 venv (backend/.venv-vllm-cu12)
# 提供,业务代码不 import vllm。torch 这里仍 pin cu12 以匹配驱动 535/CUDA 12.2,
# 否则 uv 默认会拉到 cu13 wheel,在该驱动上 import 即崩。
[tool.uv]
torch-backend = "cu126"
